  <rect x="430" y="100" width="270" height="36" rx="4" fill="#16202e" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="565" y="115" text-anchor="middle" fill="#60a5fa" font-size="9">price · fundamentals · corp-action tables</text>
  <text x="565" y="128" text-anchor="middle" fill="#475569" font-size="8">written by ingest · read by compute stages</text>
  <line x1="300" y1="119" x2="428" y2="118" stroke="#3b82f6" marker-end="url(#ab)"/>

  <!-- CENTER: instrument_eligibility -->
  <rect x="420" y="166" width="290" height="112" rx="5" fill="#2a2208" stroke="#facc15" stroke-width="1.5"/>
