<svg viewBox="0 0 1060 880" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" font-size="11">
  <title>Investment Scanner — Proposed Architecture: Measure → Decide → Assemble (2026-06-11)</title>

