  <rect x="40" y="506" width="320" height="56" rx="4" fill="#1a2a1a" stroke="#4ade80" stroke-width="1"/>
  <text x="200" y="522" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="700">on assembly complete</text>
  <text x="200" y="536" text-anchor="middle" fill="#86efac" font-size="8.5">mark date READY → evaluate alerts → refresh signal-position-ledger</text>
  <text x="200" y="550" text-anchor="middle" fill="#86efac" font-size="8.5">→ Telegram run summary (✅ / ⚠️ / ❌ on EVERY terminal state)</text>

  <!-- offline -->
  <text x="200" y="588" text-anchor="middle" fill="#64748b" font-size="8.5">offline / analytical — off the critical path</text>
  <rect x="40" y="596" width="150" height="32" rx="4" fill="#16202e" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="115" y="616" text-anchor="middle" fill="#94a3b8" font-size="9">backtesting-lab</text>
  <rect x="210" y="596" width="150" height="32" rx="4" fill="#16202e" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="285" y="616" text-anchor="middle" fill="#94a3b8" font-size="9">signal-quality-lab</text>
  <line x1="360" y1="608" x2="408" y2="592" stroke="#64748b" stroke-dasharray="4 3" marker-end="url(#a)"/>

