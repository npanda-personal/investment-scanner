  <rect x="60" y="440" width="280" height="44" rx="5" fill="#231a30" stroke="#c084fc" stroke-width="2"/>
  <text x="200" y="457" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">snapshot-assembler   ← NEW</text>
  <text x="200" y="471" text-anchor="middle" fill="#d8b4fe" font-size="8.5">composes all module outputs · versioned write · never blocks on partial</text>
  <line x1="200" y1="484" x2="200" y2="504" stroke="#c084fc" marker-end="url(#ap)"/>

