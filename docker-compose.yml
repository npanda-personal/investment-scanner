services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: investment_scanner_postgres
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m
    shm_size: 128mb
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=1MB
      - -c
      - max_connections=20
    environment:
      POSTGRES_DB: investment_scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - investment_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d investment_scanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles:
      - cache
    image: redis:7-alpine
    container_name: investment_scanner_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - investment_network
    command: redis-server --appendonly yes

  pgadmin:
    profiles:
      - tools
    image: dpage/pgadmin4:latest
    container_name: investment_scanner_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@scanner.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - investment_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  investment_network:
    driver: bridge
